blueprint:
  name: Roborock cleaner
  domain: automation
  input:
    roborock_status_entity:
      name: Roborock status entity
      description: The roborock status entity to act upon
      selector:
        entity: {}
    roborock_cleaning_binary_sensor:
      name: Roborock cleaning entity
      description: The roborock cleaning entity to act upon
      selector:
        entity:
          domain: binary_sensor
    switch_delay_seconds:
      name: Switch-delay (seconds)
      description: How long the trigger booleans must remain ON before triggering. 0 = immediately.
      default: 3
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: s
          mode: box
    ready_delay_seconds:
      name: Ready-delay (seconds)
      description: How long the robot must be 'ready' before continuing to execute its next task.
      default: 1
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: s
          mode: box
    roborock_vacuum_entity:
      name: Roborock vacuum entity (optional)
      description: >
        Only needed for the alternate-map feature below. The `save_map` command is sent here.
      default:
      selector:
        entity:
          domain: vacuum
    alternate_map_switch_input:
      name: Routine that uses the alternate map (optional)
      description: >
        Pick the same clean switch as the routine that needs the alternate map. Only that one
        routine gets the alternate zones; every other routine runs on the normal set.
        Leave empty to disable the whole feature.
      default:
      selector:
        entity:
          domain: input_boolean
    map_zones_normal:
      name: Map zones - normal set
      description: >
        The COMPLETE set of no-go zones that should normally be active. `save_map` overwrites
        everything, so anything missing from this list gets deleted.

        Enter only the two corner points of each rectangle:
          [[x1, y1, x2, y2], [x1, y1, x2, y2], ...]

        Raw Roborock coordinates (map centre is ~25500) - the values the Xiaomi Vacuum Map Card
        gives you via Copy in "Setup integer" mode. Drop the 5th number the card adds (that is
        the repeat count for zone cleaning, not part of the map).

        Optional 5th element to change the type: 0 = no-go zone (default), 1 = invisible wall
        (a line from x1,y1 to x2,y2), 2 = no-mop zone.

        Max 68 points in total (a zone = 4 points, a wall = 2).
      default: []
      selector:
        object:
    map_zones_alternate:
      name: Map zones - alternate set
      description: >
        Same list as above, minus the zone that is in the way for that one routine.
        Same format. An empty list ([]) clears all zones for that routine.
      default: []
      selector:
        object:
    map_delay_seconds:
      name: Map settle delay (seconds)
      description: >
        How long to wait after every `save_map` write - both before pressing the clean button
        and after restoring the normal set. The command is asynchronous; too short and the
        robot still runs on the previous zones.
      default: 5
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: s
          mode: box
    alternate_map_state_input:
      name: Alternate-map state helper (optional)
      description: >
        input_boolean that remembers the alternate zones are currently loaded. Required for the
        alternate-map feature.

        Writing the map while the robot is cleaning makes it PAUSE, so the normal set can never
        be restored during a run. Instead this helper is switched on before the alternate set is
        written, and the next run - once the robot is idle again - restores the normal set and
        switches the helper off before starting the next room.
      default:
      selector:
        entity:
          domain: input_boolean

    clean_switch_1_input:
      name: Clean switch 1
      selector:
        entity:
          domain: input_boolean
    clean_btn_1_input:
      name: Roborock clean action 1
      selector:
        entity:
          domain: button

    clean_switch_2_input:
      name: Clean switch 2 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_2_input:
      name: Roborock clean action 2 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_3_input:
      name: Clean switch 3 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_3_input:
      name: Roborock clean action 3 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_4_input:
      name: Clean switch 4 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_4_input:
      name: Roborock clean action 4 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_5_input:
      name: Clean switch 5 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_5_input:
      name: Roborock clean action 5 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_6_input:
      name: Clean switch 6 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_6_input:
      name: Roborock clean action 6 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_7_input:
      name: Clean switch 7 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_7_input:
      name: Roborock clean action 7 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_8_input:
      name: Clean switch 8 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_8_input:
      name: Roborock clean action 8 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_9_input:
      name: Clean switch 9 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_9_input:
      name: Roborock clean action 9 (optional)
      default:
      selector:
        entity:
          domain: button

    clean_switch_10_input:
      name: Clean switch 10 (optional)
      default:
      selector:
        entity:
          domain: input_boolean
    clean_btn_10_input:
      name: Roborock clean action 10 (optional)
      default:
      selector:
        entity:
          domain: button

mode: single

trigger_variables:
  clean_switch_trigger_1: !input clean_switch_1_input
  clean_switch_trigger_2: !input clean_switch_2_input
  clean_switch_trigger_3: !input clean_switch_3_input
  clean_switch_trigger_4: !input clean_switch_4_input
  clean_switch_trigger_5: !input clean_switch_5_input
  clean_switch_trigger_6: !input clean_switch_6_input
  clean_switch_trigger_7: !input clean_switch_7_input
  clean_switch_trigger_8: !input clean_switch_8_input
  clean_switch_trigger_9: !input clean_switch_9_input
  clean_switch_trigger_10: !input clean_switch_10_input

variables:
  clean_switch_1: !input clean_switch_1_input
  clean_btn_1: !input clean_btn_1_input
  clean_switch_2: !input clean_switch_2_input
  clean_btn_2: !input clean_btn_2_input
  clean_switch_3: !input clean_switch_3_input
  clean_btn_3: !input clean_btn_3_input
  clean_switch_4: !input clean_switch_4_input
  clean_btn_4: !input clean_btn_4_input
  clean_switch_5: !input clean_switch_5_input
  clean_btn_5: !input clean_btn_5_input
  clean_switch_6: !input clean_switch_6_input
  clean_btn_6: !input clean_btn_6_input
  clean_switch_7: !input clean_switch_7_input
  clean_btn_7: !input clean_btn_7_input
  clean_switch_8: !input clean_switch_8_input
  clean_btn_8: !input clean_btn_8_input
  clean_switch_9: !input clean_switch_9_input
  clean_btn_9: !input clean_btn_9_input
  clean_switch_10: !input clean_switch_10_input
  clean_btn_10: !input clean_btn_10_input

  task_switches: >
    {{ [clean_switch_1, clean_switch_2, clean_switch_3, clean_switch_4, clean_switch_5,
        clean_switch_6, clean_switch_7, clean_switch_8, clean_switch_9, clean_switch_10] }}
  task_buttons: >
    {{ [clean_btn_1, clean_btn_2, clean_btn_3, clean_btn_4, clean_btn_5,
        clean_btn_6, clean_btn_7, clean_btn_8, clean_btn_9, clean_btn_10] }}

  # Index of the task to run: the first switch that is on and has a button. -1 = nothing to do.
  pending_index: >
    {% set ns = namespace(i=-1) %}
    {% for n in range(10) %}
      {% if ns.i < 0 and task_switches[n] and task_buttons[n] and is_state(task_switches[n], 'on') %}
        {% set ns.i = n %}
      {% endif %}
    {% endfor %}
    {{ ns.i }}
  pending_switch: "{{ task_switches[pending_index] if pending_index >= 0 else none }}"
  pending_button: "{{ task_buttons[pending_index] if pending_index >= 0 else none }}"

  vacuum_entity: !input roborock_vacuum_entity
  alt_map_switch: !input alternate_map_switch_input
  alt_map_state: !input alternate_map_state_input
  zones_normal: !input map_zones_normal
  zones_alternate: !input map_zones_alternate

  # Expand [x1, y1, x2, y2] rectangles into what save_map wants:
  #   type 1 (wall) -> [1, x1, y1, x2, y2]
  #   type 0 / 2    -> [t, x1, y1, x2, y1, x2, y2, x1, y2]  (four corners, clockwise)
  payload_normal: >
    {% set ns = namespace(out=[]) %}
    {% for z in (zones_normal or []) %}
      {% set t = z[4] if z | count > 4 else 0 %}
      {% if t == 1 %}
        {% set ns.out = ns.out + [[1, z[0], z[1], z[2], z[3]]] %}
      {% else %}
        {% set ns.out = ns.out + [[t, z[0], z[1], z[2], z[1], z[2], z[3], z[0], z[3]]] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}
  payload_alternate: >
    {% set ns = namespace(out=[]) %}
    {% for z in (zones_alternate or []) %}
      {% set t = z[4] if z | count > 4 else 0 %}
      {% if t == 1 %}
        {% set ns.out = ns.out + [[1, z[0], z[1], z[2], z[3]]] %}
      {% else %}
        {% set ns.out = ns.out + [[t, z[0], z[1], z[2], z[1], z[2], z[3], z[0], z[3]]] %}
      {% endif %}
    {% endfor %}
    {{ ns.out }}

  # The feature only arms itself with a vacuum, a chosen routine, a state helper and a
  # non-empty normal set, so a half-filled configuration can never wipe the map.
  map_enabled: >
    {{ vacuum_entity not in [none, ''] and alt_map_switch not in [none, '']
       and alt_map_state not in [none, ''] and payload_normal | count > 0 }}
  use_alternate_map: "{{ map_enabled and pending_switch == alt_map_switch }}"
  restore_pending: "{{ map_enabled and is_state(alt_map_state, 'on') }}"

triggers:
  - trigger: template
    value_template: >
      {{ is_state(clean_switch_trigger_1, 'on')
         or (clean_switch_trigger_2 and is_state(clean_switch_trigger_2, 'on'))
         or (clean_switch_trigger_3 and is_state(clean_switch_trigger_3, 'on'))
         or (clean_switch_trigger_4 and is_state(clean_switch_trigger_4, 'on'))
         or (clean_switch_trigger_5 and is_state(clean_switch_trigger_5, 'on'))
         or (clean_switch_trigger_6 and is_state(clean_switch_trigger_6, 'on'))
         or (clean_switch_trigger_7 and is_state(clean_switch_trigger_7, 'on'))
         or (clean_switch_trigger_8 and is_state(clean_switch_trigger_8, 'on'))
         or (clean_switch_trigger_9 and is_state(clean_switch_trigger_9, 'on'))
         or (clean_switch_trigger_10 and is_state(clean_switch_trigger_10, 'on')) }}
    for:
      seconds: !input switch_delay_seconds

  - trigger: state
    entity_id: !input roborock_cleaning_binary_sensor
    to: "off"
    for:
      seconds: !input ready_delay_seconds

  - trigger: state
    entity_id: !input roborock_status_entity
    to:
      - idle
      - charging
    for:
      seconds: !input ready_delay_seconds

  - trigger: time_pattern
    minutes: "/30"

condition:
  - condition: state
    entity_id: !input roborock_cleaning_binary_sensor
    state: "off"
    for:
      seconds: !input ready_delay_seconds
  - condition: state
    entity_id: !input roborock_status_entity
    state:
      - idle
      - charging
    for:
      seconds: !input ready_delay_seconds

action:
  # ---------------------------------------------------------------------------
  # The alternate zones are still loaded from a previous run and the robot is idle
  # again (the conditions above guarantee that), so put the normal set back first.
  # Skipped when the pending task wants the alternate set anyway - that would only
  # write the map twice for nothing.
  # ---------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ restore_pending and not use_alternate_map }}"
    then:
      - service: vacuum.send_command
        target:
          entity_id: "{{ vacuum_entity }}"
        data:
          command: save_map
          params: "{{ payload_normal }}"
      - delay:
          seconds: !input map_delay_seconds
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ alt_map_state }}"

  # Nothing switched on -> nothing to do.
  - condition: template
    value_template: "{{ pending_index >= 0 }}"

  # Only for the one routine that needs it: load the alternate zones first. The helper goes on
  # before the write, so an interrupted run can never leave the alternate set behind unnoticed.
  - if:
      - condition: template
        value_template: "{{ use_alternate_map }}"
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: "{{ alt_map_state }}"
      - service: vacuum.send_command
        target:
          entity_id: "{{ vacuum_entity }}"
        data:
          command: save_map
          params: "{{ payload_alternate }}"
      - delay:
          seconds: !input map_delay_seconds

  - service: button.press
    target:
      entity_id: "{{ pending_button }}"

  # Wait until the robot has actually picked the job up.
  - wait_for_trigger:
      - platform: state
        entity_id: !input roborock_cleaning_binary_sensor
        to: "on"
        for: "00:00:05"
    timeout: "00:02:05"
    continue_on_timeout: true

  # Only clear the switch if it really started - otherwise the next run retries.
  - if:
      - condition: template
        value_template: "{{ wait.trigger is not none }}"
    then:
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ pending_switch }}"
